<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משכן יהודה - אזור אישי</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2, h3 {
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: right;
        }
        th {
            background-color: #f2f2f2;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>משכן יהודה - כניסה לחברים</h2>
    
    <!-- טופס התחברות -->
    <div id="login-form">
        <div class="form-group">
            <label for="username">שם משתמש (ת"ז):</label>
            <input type="text" id="username" placeholder="הכנס תעודת זהות">
        </div>
        <div class="form-group">
            <label for="password">סיסמה:</label>
            <input type="password" id="password" placeholder="הכנס סיסמה">
        </div>
        <button onclick="login()">התחבר</button>
        <div id="error-msg" class="error"></div>
    </div>

    <!-- אזור נתונים לאחר התחברות -->
    <div id="user-data" class="hidden">
        <h3 id="welcome-msg"></h3>
        <h4>היסטוריית תשלומים ותרומות</h4>
        
        <table>
            <thead>
                <tr>
                    <th>תאריך</th>
                    <th>סכום</th>
                    <th>אמצעי תשלום</th>
                    <th>פירוט / תרומה</th>
                </tr>
            </thead>
            <tbody id="payments-table-body">
            </tbody>
        </table>
        
        <br>
        <button onclick="logout()" style="background-color: #dc3545;">התנתק</button>
    </div>
</div>

<script>
    // הקישור המעודכן ל-Google Apps Script שלך:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxRPd7etipYL5UpxExgafSd7-aSFDf1kJzigmA-b1bQzqohLjct2TbmSFKyts9xW154Lg/exec";

    function login() {
        const usernameInput = document.getElementById('username').value.trim();
        const passwordInput = document.getElementById('password').value.trim();
        const errorMsg = document.getElementById('error-msg');
        
        errorMsg.innerText = "מתחבר, אנא המתן...";

        fetch(`${SCRIPT_URL}?action=login&username=${encodeURIComponent(usernameInput)}&password=${encodeURIComponent(passwordInput)}`)
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    errorMsg.innerText = "";
                    showUserData(data);
                } else {
                    errorMsg.innerText = data.message || "פרטי התחברות שגויים";
                }
            })
            .catch(err => {
                console.error(err);
                errorMsg.innerText = "אירעה שגיאה בתקשורת עם השרת";
            });
    }

    function showUserData(data) {
        document.getElementById('login-form').classList.add('hidden');
        document.getElementById('user-data').classList.remove('hidden');
        document.getElementById('welcome-msg').innerText = `שלום, ${data.user.name}`;

        const tbody = document.getElementById('payments-table-body');
        tbody.innerHTML = "";

        if (data.payments && data.payments.length > 0) {
            data.payments.forEach(payment => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${payment.date || ''}</td>
                    <td>${payment.amount || ''}</td>
                    <td>${payment.method || ''}</td>
                    <td>${payment.description || ''}</td>
                `;
                tbody.appendChild(tr);
            });
        } else {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">לא נמצאו תשלומים</td></tr>`;
        }
    }

    function logout() {
        document.getElementById('username').value = "";
        document.getElementById('password').value = "";
        document.getElementById('user-data').classList.add('hidden');
        document.getElementById('login-form').classList.remove('hidden');
    }
</script>

</body>
</html>
