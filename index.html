<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);

        h1 {
            color: #2c3e50;
        }
        .notice {
            background-color: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="notice">בדיקת עדכון: המערכת פועלת בצורה תקינה!</div>
        <h1>ברוכים הבאים למשכן יהודה</h1>
        <p>האתר מעודכן ופעיל ב-GitHub Pages.</p>
    </div>

</html>
