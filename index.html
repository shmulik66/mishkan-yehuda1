<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>לוח אישי - מתפלל</title>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .dashboard-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
        }

        .user-title {
            text-align: center;
            color: #0f172a;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 24px;
        }

        /* גריד של 4 קוביות */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        @media (min-width: 600px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .stat-box {
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-label {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .stat-val {
            font-size: 1.4rem;
            font-weight: bold;
        }

        /* צבעים לקוביות */
        .box-credit {
            background-color: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .box-debit {
            background-color: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .box-balance {
            background-color: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
        }

        .box-donation {
            background-color: #f5f3ff;
            color: #6d28d9;
            border: 1px solid #ddd6fe;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="dashboard-card">
        <div class="user-title" id="userName">שלום אביה</div>

        <div class="stats-grid">
            <!-- קוביה 1: זכות -->
            <div class="stat-box box-credit">
                <div class="stat-label">זכות (שולם)</div>
                <div id="statCredit" class="stat-val">₪ 2,218</div>
            </div>

            <!-- קוביה 2: חובה -->
            <div class="stat-box box-debit">
                <div class="stat-label">חובה (חיובים)</div>
                <div id="statDebit" class="stat-val">₪ 2,215</div>
            </div>

            <!-- קוביה 3: יתרה -->
            <div class="stat-box box-balance">
                <div class="stat-label">יתרה לתשלום</div>
                <div id="statBalance" class="stat-val">₪ 3</div>
            </div>

            <!-- קוביה 4: תרומה (חדש) -->
            <div class="stat-box box-donation">
                <div class="stat-label">תרומה</div>
                <div id="statDonation" class="stat-val">₪ 0</div>
            </div>
        </div>
    </div>
</div>

<script>
    // פונקציה לעדכון הנתונים מקובץ הגוגל שיטס
    function updateDashboard(userData) {
        if (!userData) return;
        
        if (userData.name) {
            document.getElementById('userName').textContent = "שלום " + userData.name;
        }
        
        if (userData.summary) {
            document.getElementById('statCredit').textContent = "₪ " + (userData.summary.credit || 0).toLocaleString();
            document.getElementById('statDebit').textContent = "₪ " + (userData.summary.debit || 0).toLocaleString();
            document.getElementById('statBalance').textContent = "₪ " + (userData.summary.balance || 0).toLocaleString();
            document.getElementById('statDonation').textContent = "₪ " + (userData.summary.donation || 0).toLocaleString();
        }
    }
</script>

</body>
</html>
