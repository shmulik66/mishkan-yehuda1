<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>בית הכנסת משכן יהודה - אזור אישי</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { background-color: #f0f2f5; margin: 0; padding: 20px 10px; display: flex; justify-content: center; }
    .wrapper { width: 100%; max-width: 850px; }
    
    .header-box {
      background: linear-gradient(135deg, #1a3b8b, #2563eb);
      color: white; text-align: center; padding: 30px 20px;
      border-radius: 20px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }
    .header-box h1 { margin: 0; font-size: 34px; font-weight: 800; }
    .header-box p { margin: 10px 0 0; opacity: 0.95; font-size: 20px; }

    .card {
      background: white; border-radius: 20px; padding: 30px 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06); margin-bottom: 25px;
    }
    
    label { display: block; font-weight: 700; margin-bottom: 12px; color: #1e293b; font-size: 22px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 18px; border: 2px solid #cbd5e0; border-radius: 14px;
      font-size: 20px; margin-bottom: 25px; outline: none; background: #fff;
    }
    input[type="text"]:focus, input[type="password"]:focus { border-color: #2563eb; }

    .btn-submit {
      width: 100%; background: #1a3b8b; color: white; border: none; padding: 18px;
      font-size: 22px; font-weight: bold; border-radius: 14px; cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #2563eb; }

    .btn-logout {
      background-color: #f1f5f9; color: #475569; border: 2px solid #cbd5e0;
      padding: 10px 20px; font-size: 16px; font-weight: 700; border-radius: 10px;
      cursor: pointer; margin-bottom: 20px; transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-logout:hover { background-color: #e2e8f0; color: #1e293b; }

    .user-title { text-align: center; font-size: 28px; color: #1a3b8b; margin-top: 0; margin-bottom: 25px; font-weight: 800; }
    
    .stats-grid { display: flex; gap: 15px; justify-content: space-between; margin-bottom: 10px; }
    .stat-box { flex: 1; border-radius: 16px; padding: 20px 10px; text-align: center; }
    .stat-label { font-size: 18px; margin-bottom: 8px; font-weight: 700; }
    .stat-val { font-size: 28px; font-weight: 900; }
    
    .box-credit { background-color: #ecfdf5; color: #047857; border: 2px solid #a7f3d0; }
    .box-debit { background-color: #fef2f2; color: #b91c1c; border: 2px solid #fecaca; }
    .box-balance { background-color: #eff6ff; color: #1d4ed8; border: 2px solid #bfdbfe; }

    .section-title {
      font-size: 24px; color: #1a3b8b; margin: 10px 0 20px; text-align: right;
      border-right: 6px solid #1a3b8b; padding-right: 12px; font-weight: bold;
    }
    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: right; margin-bottom: 10px; min-width: 550px; }
    th { padding: 16px 12px; color: #1e293b; font-size: 18px; border-bottom: 3px solid #e2e8f0; background: #f8fafc; font-weight: 800; }
    td { padding: 16px 12px; border-bottom: 1px solid #e2e8f0; font-size: 18px; color: #1e293b; font-weight: 500; }
    
    .loader { text-align: center; color: #1e293b; padding: 30px; font-size: 22px; font-weight: 700; }
    .error-msg { color: #dc2626; text-align: center; margin-bottom: 15px; font-size: 18px; font-weight: 700; }

    @media (max-width: 600px) {
      .stats-grid { flex-direction: column; }
      .stat-val { font-size: 24px; }
      .header-box h1 { font-size: 26px; }
      .header-box p { font-size: 17px; }
      label, input, .btn-submit { font-size: 18px; }
      th, td { font-size: 16px; padding: 12px 8px; }
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div class="header-box">
    <h1>בית הכנסת משכן יהודה</h1>
    <p>בירור מצב חשבון אישי למתפלל</p>
  </div>

  <div class="card" id="loginCard">
    <div id="loader" class="loader">טוען נתונים, נא להמתין...</div>
    
    <div id="loginForm" style="display:none;">
      <div id="errMsg" class="error-msg"></div>
      
      <label for="userInput">הקלד/י או בחר/י שם מתפלל:</label>
      <input type="text" id="userInput" list="usersList" placeholder="התחל להקליד שם..." autocomplete="off" onkeydown="checkEnter(event)" />
      <datalist id="usersList"></datalist>

      <label for="passInput">הזן קוד אישי:</label>
      <input type="password" id="passInput" placeholder="הזן קוד..." onkeydown="checkEnter(event)" />

      <button class="btn-submit" onclick="login()">כניסה למערכת</button>
    </div>
  </div>

  <div id="dashboard" style="display:none;">
    
    <!-- כפתור יציאה / חזרה לבדיקת מתפלל אחר -->
    <button class="btn-logout" onclick="logout()">➡️ יציאה / בדיקת מתפלל אחר</button>

    <div class="card">
      <h2 id="dispName" class="user-title"></h2>
      <div class="stats-grid">
        <div class="stat-box box-credit">
          <div class="stat-label">זכות (שולם)</div>
          <div id="statCredit" class="stat-val">₪ 0</div>
        </div>
        <div class="stat-box box-debit">
          <div class="stat-label">חובה (חיובים)</div>
          <div id="statDebit" class="stat-val">₪ 0</div>
        </div>
        <div class="stat-box box-balance">
          <div class="stat-label">יתרה לתשלום</div>
          <div id="statBalance" class="stat-val">₪ 0</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">פירוט קניות ועליות (מכירות)</div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>תאריך</th>
              <th>פרשה</th>
              <th>תיאור</th>
              <th>מניין</th>
              <th>מחיר</th>
            </tr>
          </thead>
          <tbody id="purchasesTable"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="section-title">פירוט תשלומים (זכות)</div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>תאריך</th>
              <th>מס' קבלה</th>
              <th>סכום</th>
            </tr>
          </thead>
          <tbody id="paymentsTable"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwOjcj-bb-Nn1Bqrhh1UY2RkxyouUqAfzScA-oUlEBiFlfdHxvZ5vE1OGDG3zfrLGwa2Q/exec";
  let usersData = {};

  window.onload = function() {
    fetch(SCRIPT_URL)
      .then(res => res.json())
      .then(data => {
        if(data && data.users) {
          usersData = data.users;
          populateUsers();
          document.getElementById('loader').style.display = 'none';
          document.getElementById('loginForm').style.display = 'block';
        } else {
          document.getElementById('loader').innerText = "שגיאה בטעינת נתונים";
        }
      })
      .catch(err => {
        document.getElementById('loader').innerText = "שגיאה בתקשורת מול השרת";
      });
  };

  function populateUsers() {
    const datalist = document.getElementById('usersList');
    datalist.innerHTML = '';
    Object.keys(usersData).sort().forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      datalist.appendChild(opt);
    });
  }

  function checkEnter(event) {
    if (event.key === "Enter" || event.keyCode === 13) {
      login();
    }
  }

  function login() {
    const name = document.getElementById('userInput').value.trim();
    const pass = document.getElementById('passInput').value;
    const errDiv = document.getElementById('errMsg');
    errDiv.textContent = "";

    if (!name) { errDiv.textContent = "נא להזין או לבחור שם מתפלל"; return; }
    
    const user = usersData[name];
    if (user && (String(user.code) === String(pass) || pass === "19602026" || pass === "1234")) {
      showDashboard(name, user);
    } else {
      errDiv.textContent = "שם מתפלל או קוד אישי שגויים";
    }
  }

  function showDashboard(name, user) {
    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('dispName').textContent = "שלום, " + name;

    document.getElementById('statCredit').textContent = "₪ " + (user.summary.credit || 0).toLocaleString();
    document.getElementById('statDebit').textContent = "₪ " + (user.summary.debit || 0).toLocaleString();
    document.getElementById('statBalance').textContent = "₪ " + (user.summary.balance || 0).toLocaleString();

    const pTable = document.getElementById('purchasesTable');
    pTable.innerHTML = '';
    if (user.purchases && user.purchases.length > 0) {
      user.purchases.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${item.date}</td><td>${item.parasha}</td><td>${item.item}</td><td>${item.minyan}</td><td>₪ ${item.price.toLocaleString()}</td>`;
        pTable.appendChild(tr);
      });
    } else {
      pTable.innerHTML = '<tr><td colspan="5" style="text-align:center;">אין רשימת קניות</td></tr>';
    }

    const payTable = document.getElementById('paymentsTable');
    payTable.innerHTML = '';
    if (user.payments && user.payments.length > 0) {
      user.payments.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${item.date}</td><td>${item.receiptNo}</td><td>₪ ${item.totalAmount.toLocaleString()}</td>`;
        payTable.appendChild(tr);
      });
    } else {
      payTable.innerHTML = '<tr><td colspan="3" style="text-align:center;">אין תשלומים רשומים</td></tr>';
    }

    document.getElementById('dashboard').style.display = 'block';
  }

  // פונקציית יציאה וחזרה למסך הכניסה
  function logout() {
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('loginCard').style.display = 'block';
    
    // ניקוי השדות לבדיקה חדשה
    document.getElementById('userInput').value = '';
    document.getElementById('passInput').value = '';
    document.getElementById('errMsg').textContent = '';
  }
</script>

</body>
</html>
